name: CI

on:
  push:
    branches:
      - main
  pull_request:

# One run per branch: pushes to main queue behind each other so two releases can never
# race; pushes to a PR cancel the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; the release job requests what it needs.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---- Stage 1: cheap checks and the version decision, all in parallel -----------------

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.run_semantic_release.outputs.version }}
      tag: ${{ steps.run_semantic_release.outputs.tag }}
      released: ${{ steps.run_semantic_release.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - id: run_semantic_release
        uses: python-semantic-release/python-semantic-release@v9.12.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: false
          changelog: true
          build: false
          commit: false
          push: false
          vcs_release: false
          root_options: "-v"

      - name: Upload changelog artefact
        uses: actions/upload-artifact@v6
        with:
          name: changelog-artefact
          path: CHANGELOG.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: |
          uvx ruff check src tests
          uvx ruff format --check src tests
      - name: clang-format
        run: >
          uvx clang-format --dry-run --Werror
          $(git ls-files 'src/cpp/*.cpp' 'src/cpp/*.h' 'tests/cpp/*.cpp')

  # Native C++ test suite (Catch2) through the plain CMake build.
  cpp-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cpp-tests-${{ matrix.os }}
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Configure
        run: >
          cmake -S . -B build-cpp -DBUILD_PCT_TOOLS_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-cpp --parallel --target pct_tools_tests
      - name: Test
        run: ctest --test-dir build-cpp -R pct_tools_tests --output-on-failure

  # Python test suite against a source install, so it runs on every push and PR and not
  # only when a release is due.
  py-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: py-tests-${{ matrix.os }}
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install from source
        run: |
          uv venv --python ${PYTHON_VERSION}
          uv pip install '.[test]'
      - name: Run Python tests
        run: .venv/bin/pytest tests/python

  # ---- Stage 2: wheels, only for a releasable commit and only once the checks pass ------

  build:
    needs:
      - version
      - lint
      - cpp-tests
      - py-tests
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_build: cp312-manylinux_x86_64
          - os: ubuntu-24.04-arm
            cibw_build: cp312-manylinux_aarch64
          - os: macos-14
            cibw_build: cp312-macosx_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set package version
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          head -n 3 pyproject.toml

      # The tests run inside cibuildwheel against the freshly built wheel, on the target
      # platform (test-command and test-extras in pyproject.toml).
      - name: Build and test wheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          # delocate bundles libomp.dylib into the wheel; it must match the deployment target.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        with:
          output-dir: wheelhouse

      - name: Upload wheel artefacts
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.cibw_build }}
          path: wheelhouse

  # ---- Stage 3: tag, then publish --------------------------------------------------------

  release:
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    if: github.ref == 'refs/heads/main' && needs.version.outputs.released == 'true'
    # Trusted publishing (OIDC): the `pypi` environment must be registered as a publisher
    # on PyPI for this repository and workflow; no API token is stored.
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      TAG_NAME: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Download changelog artefact
        uses: actions/download-artifact@v7
        with:
          name: changelog-artefact
          path: .

      - name: Set package version
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          rm -f pyproject.toml.bak

      # The commit and tag go first: if publishing fails afterwards, re-running the failed
      # job repeats this step too, so it is skipped when the tag is already on the remote
      # and the re-run only retries the upload with the same artefacts; skip-existing
      # makes that safe. Pushes made with GITHUB_TOKEN do not trigger another workflow run.
      - name: Commit changelog and version, tag, push
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "${TAG_NAME} already exists on the remote; skipping commit and push"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml
          git commit -m "release: ${TAG_NAME}"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin HEAD:main "refs/tags/${TAG_NAME}"

      - name: Download wheel artefacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheelhouse

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          skip-existing: true
